name: "nyc_analytics"
version: "1.0.0"
config-version: 2

profile: "default"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  nyc_analytics:
    +materialized: table

    project_work:
      staging:
        +materialized: view
        +schema: group8_staging

      marts:
        +materialized: table
        +schema: group8_warehouse_marts

        conformed:
          +materialized: table

        evictions:
          +materialized: table

        nyc_311:
          +materialized: table